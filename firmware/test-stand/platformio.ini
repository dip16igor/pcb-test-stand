; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:genericSTM32F103RE]
platform = ststm32
board = genericSTM32F103RE
framework = arduino
upload_protocol = stlink
board_build.f_cpu = 64000000L
monitor_speed = 115200
build_flags =
  -D FW_VERSION=\"1.0.0\"
  -D FW_DATE=\"2026-09-11\"
  -D ENABLE_HWSERIAL3

[env:bluepill_f103c8]
; Test build for BluePill (STM32F103C8, LQFP48): validates UART protocol and
; GPIO logic on real hardware. Reduced pin set (18/27): PC2-PC12, PD0/PD2
; don't exist on this package → ERR INVALID_PIN. UART3 on PB10/PB11.
platform = ststm32
board = bluepill_f103c8
framework = arduino
upload_protocol = stlink
board_build.f_cpu = 72000000L
monitor_speed = 115200
build_flags =
  -D FW_VERSION=\"1.0.0\"
  -D FW_DATE=\"2026-09-11\"
  -D ENABLE_HWSERIAL3
  -D BLUEPILL_TEST
