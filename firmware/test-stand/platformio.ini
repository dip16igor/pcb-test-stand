; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:genericSTM32F103RE]
platform = ststm32
board = genericSTM32F103RE
framework = arduino
upload_protocol = stlink
board_build.f_cpu = 64000000L
monitor_speed = 115200
build_flags =
  -D FW_VERSION=\"1.3.0\"
  -D FW_DATE=\"2026-09-28\"
  -D ENABLE_HWSERIAL3
  ; High-impedance dividers (5V5_IN 100k/100k = 50k source): the default
  ; 13.5-cycle S/H can't settle, reading ~1/3 low. 239.5 cycles (~28 us).
  -D ADC_SAMPLINGTIME=ADC_SAMPLETIME_239CYCLES_5
