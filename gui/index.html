<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PCB Test Stand</title>
<!-- Served by the daemon: page at /, assets at /static/* (spec §4.3). -->
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<h1>PCB Test Stand <span id="status" class="unknown">Disconnected</span> <span id="fwver"></span> <span id="pwrstate">POWER_OFF</span> <span id="link" class="unknown" title="link quality">LINK ?</span> <span id="portinfo" title="COM port and baudrate"></span> <label id="ilock"><input type="checkbox" id="interlock" checked> Interlock</label> <a id="editlink" href="?edit" target="_blank" rel="noopener">Edit layout</a></h1>

<div class="board">
  <img src="static/scheme.png" class="underlay" alt="PCB functional diagram">

  <!-- Output controls. Coordinates are % of the board box: replacing
       scheme.png only requires moving these top/left pairs (see README). -->
  <!-- Left: mains input chain -->
  <label class="control" style="top: 24.7%; left: 58.4%;"><input type="checkbox" data-pin="PIN_PC4" data-dir="OUT">PWR1</label>
  <label class="control" style="top: 24.9%; left: 33.7%;"><input type="checkbox" data-pin="PIN_PC5" data-dir="OUT">EN</label>
  <!-- Left: 9-32V input chain -->
  <label class="control" style="top: 63.7%; left: 58.3%;"><input type="checkbox" data-pin="PIN_PA4" data-dir="OUT">PWR2</label>
  <label class="control" style="top: 75.4%; left: 29.7%;"><input type="checkbox" data-pin="PIN_PC15" data-dir="OUT">EN_24V2</label>
  <!-- Chargers -->
  <label class="control" style="top: 25.9%; left: 44.4%;"><input type="checkbox" data-pin="PIN_PA11" data-dir="OUT">CE1</label>
  <label class="control" style="top: 65.2%; left: 44.6%;"><input type="checkbox" data-pin="PIN_PB3" data-dir="OUT">CE2</label>
  <!-- Output switches / converters -->
  <label class="control" style="top: 25.3%; left: 23.7%;"><input type="checkbox" data-pin="PIN_PC13" data-dir="OUT">POWER1</label>
  <label class="control" style="top: 74.6%; left: 17%;"><input type="checkbox" data-pin="PIN_PC14" data-dir="OUT">POWER2</label>
  <label class="control" style="top: 33.7%; left: 77.2%;"><input type="checkbox" data-pin="PIN_PA7" data-dir="OUT">EN_24V</label>
  <label class="control" style="top: 48.1%; left: 77.2%;"><input type="checkbox" data-pin="PIN_PA6" data-dir="OUT">EN_12V</label>
  <label class="control" style="top: 62.5%; left: 77.1%;"><input type="checkbox" data-pin="PIN_PA5" data-dir="OUT">EN_7V</label>
  <!-- Board LEDs -->
  <label class="control" style="top: 96%; left: 26%;"><input type="checkbox" data-pin="PIN_PD0" data-dir="OUT">LED0</label>
  <label class="control" style="top: 96%; left: 32%;"><input type="checkbox" data-pin="PIN_PB8" data-dir="OUT">LED1</label>
  <label class="control" style="top: 96%; left: 38%;"><input type="checkbox" data-pin="PIN_PB9" data-dir="OUT">LED2</label>
  <div class="indicator unknown" style="top: 11.4%; left: 31.1%;" data-pin="PIN_PC2" data-dir="IN" title="PG"><span>PG</span></div>
  <div class="indicator unknown" style="top: 11.4%; left: 34.5%;" data-pin="PIN_PB0" data-dir="IN" title="ALERT"><span>ALERT</span></div>
  <div class="indicator unknown" style="top: 8.8%; left: 46.8%;" data-pin="PIN_PA15" data-dir="IN" title="STAT1_1"><span>STAT1_1</span></div>
  <div class="indicator unknown" style="top: 11.6%; left: 46.8%;" data-pin="PIN_PA12" data-dir="IN" title="STAT2_1"><span>STAT2_1</span></div>
  <div class="indicator unknown" style="top: 36.5%; left: 51.7%;" data-pin="PIN_PC8" data-dir="IN" title="COMP1"><span>COMP1</span></div>
  <div class="indicator unknown" style="top: 50.8%; left: 43.9%;" data-pin="PIN_PC12" data-dir="IN" title="PG2"><span>PG2</span></div>
  <div class="indicator unknown" style="top: 11.5%; left: 43.7%;" data-pin="PIN_PA8" data-dir="IN" title="PG1"><span>PG1</span></div>
  <div class="indicator unknown" style="top: 19.3%; left: 74%;" data-pin="PIN_PB1" data-dir="IN" title="PGOOD"><span>PGOOD</span></div>
  <div class="indicator unknown" style="top: 60.1%; left: 29.4%;" data-pin="PIN_PB2" data-dir="IN" title="PGOOD2"><span>PGOOD2</span></div>
  <div class="indicator unknown" style="top: 48.4%; left: 47.3%;" data-pin="PIN_PD2" data-dir="IN" title="STAT1_2"><span>STAT1_2</span></div>
  <div class="indicator unknown" style="top: 92.9%; left: 25.2%;" data-pin="PIN_PD1" data-dir="IN" title="PD1"><span>PD1</span></div>
  <div class="indicator unknown" style="top: 51.1%; left: 47.3%;" data-pin="PIN_PC9" data-dir="IN" title="STAT2_2"><span>STAT2_2</span></div>
  <div class="indicator unknown" style="top: 76.8%; left: 52%;" data-pin="PIN_PB15" data-dir="IN" title="COMP2"><span>COMP2</span></div>
  <div class="indicator unknown" style="top: 95.9%; left: 21.2%;" data-pin="PIN_PA0" data-dir="IN" title="KEY"><span>KEY</span></div>

  <!-- Analog readouts (v1.1.0). data-pin carries the layout key (PIN_ + name);
       data-volt selects the ADC channel. Hidden until first ADC reading. -->
  <div class="voltread" style="top: 24.8%; left: 68.7%;" data-pin="PIN_VSYS" data-volt="VSYS" title="VSYS"><span class="vname">VSYS</span> <span class="vval">—</span></div>
  <div class="voltread" style="top: 11.4%; left: 20.1%;" data-pin="PIN_24V_IN1" data-volt="24V_IN1" title="24V_IN1"><span class="vname">24V_IN1</span> <span class="vval">—</span></div>
  <div class="voltread" style="top: 59.7%; left: 23.1%;" data-pin="PIN_24V_IN2" data-volt="24V_IN2" title="24V_IN2"><span class="vname">24V_IN2</span> <span class="vval">—</span></div>
  <div class="voltread" style="top: 68.1%; left: 95.2%;" data-pin="PIN_5V5_IN" data-volt="5V5_IN" title="5V5_IN"><span class="vname">5V5_IN</span> <span class="vval">—</span></div>
  <div class="voltread" style="top: 4%; left: 95.6%;" data-pin="PIN_VCC" data-volt="VCC" title="MCU supply (VDDA from VREFINT)"><span class="vname">VCC</span> <span class="vval">—</span></div>

  <!-- 5V5_IN trend chart (0..6 V, 5 min window). Draggable in ?edit; corner
       handle resizes (width/height px persist via Save like coordinates). -->
  <div class="chart" style="top: 84.2%; left: 77.6%; width: 833.8px; height: 246.8px;" data-pin="PIN_CHART_5V5_IN" data-chart="5V5_IN" title="5V5_IN trend"><div class="chead">5V5_IN · 0..6V · 5min</div><canvas></canvas><div class="rhandle"></div></div>

  <!-- PWM outputs (v1.4.0): TIM3 CH1/CH2 on PC6/PC7, 0..100% duty.
       Draggable in ?edit; width (px) persists via Save like coordinates. -->
  <div class="pwmslider" style="top: 41.6%; left: 57.7%; width: 260px;" data-pin="PIN_PC6" data-pwm="PC6" title="PWM PC6 (TIM3 CH1)"><span class="pname">PWM1</span><input type="range" min="0" max="100" step="1" value="0" data-pin="PIN_PC6"><span class="pval">0%</span><div class="rhandle"></div></div>
  <div class="pwmslider" style="top: 67.6%; left: 57.6%; width: 260px;" data-pin="PIN_PC7" data-pwm="PC7" title="PWM PC7 (TIM3 CH2)"><span class="pname">PWM2</span><input type="range" min="0" max="100" step="1" value="0" data-pin="PIN_PC7"><span class="pval">0%</span><div class="rhandle"></div></div>
</div>

<div id="editbar" hidden>
  <b>EDIT MODE</b> — drag elements with the mouse.
  <span id="editread">—</span>
  <button id="editcopy" type="button">Copy layout HTML</button>
  <button id="editsave" type="button">Save to index.html</button>
  <button id="editreset" type="button">Reset saved</button><br>
  <textarea id="editout" rows="6" cols="100" readonly
    placeholder="Drag, then Copy layout HTML and paste the lines back into index.html"></textarea>
</div>

<script src="static/script.js"></script>
</body>
</html>
