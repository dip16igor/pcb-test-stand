<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PCB Test Stand</title>
<!-- Served by the daemon: page at /, assets at /static/* (spec §4.3). -->
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<h1>PCB Test Stand <span id="status" class="unknown">Disconnected</span> <span id="fwver"></span></h1>

<div class="board">
  <img src="static/scheme.png" class="underlay" alt="PCB functional diagram">

  <!-- Output controls. Coordinates are % of the board box: replacing
       scheme.png only requires moving these top/left pairs (see README). -->
  <!-- Left: mains input chain -->
  <label class="control" style="top: 17.9%; left: 21.7%;"><input type="checkbox" data-pin="PIN_PC4" data-dir="OUT">PWR1</label>
  <label class="control" style="top: 8%; left: 26%;"><input type="checkbox" data-pin="PIN_PC5" data-dir="OUT">EN</label>
  <!-- Left: 9-32V input chain -->
  <label class="control" style="top: 70.4%; left: 17.1%;"><input type="checkbox" data-pin="PIN_PA4" data-dir="OUT">PWR2</label>
  <label class="control" style="top: 70.1%; left: 25.5%;"><input type="checkbox" data-pin="PIN_PC15" data-dir="OUT">EN_24V2</label>
  <!-- Chargers -->
  <label class="control" style="top: 29.1%; left: 43%;"><input type="checkbox" data-pin="PIN_PA11" data-dir="OUT">CE1</label>
  <label class="control" style="top: 74.2%; left: 43.1%;"><input type="checkbox" data-pin="PIN_PB3" data-dir="OUT">CE2</label>
  <!-- Output switches / converters -->
  <label class="control" style="top: 27.8%; left: 56.5%;"><input type="checkbox" data-pin="PIN_PC13" data-dir="OUT">POWER1</label>
  <label class="control" style="top: 59.1%; left: 56.5%;"><input type="checkbox" data-pin="PIN_PC14" data-dir="OUT">POWER2</label>
  <label class="control" style="top: 34.9%; left: 75.4%;"><input type="checkbox" data-pin="PIN_PA7" data-dir="OUT">EN_24V</label>
  <label class="control" style="top: 51.7%; left: 75.6%;"><input type="checkbox" data-pin="PIN_PA6" data-dir="OUT">EN_12V</label>
  <label class="control" style="top: 68.1%; left: 75.6%;"><input type="checkbox" data-pin="PIN_PA5" data-dir="OUT">EN_7V</label>
  <!-- Board LEDs -->
  <label class="control" style="top: 96%; left: 26%;"><input type="checkbox" data-pin="PIN_PD0" data-dir="OUT">LED0</label>
  <label class="control" style="top: 96%; left: 32%;"><input type="checkbox" data-pin="PIN_PB8" data-dir="OUT">LED1</label>
  <label class="control" style="top: 96%; left: 38%;"><input type="checkbox" data-pin="PIN_PB9" data-dir="OUT">LED2</label>
  <div class="indicator unknown" style="top: 16%; left: 18%;" data-pin="PIN_PC2" data-dir="IN" title="PG"><span>PG</span></div>
  <div class="indicator unknown" style="top: 16%; left: 30%;" data-pin="PIN_PB0" data-dir="IN" title="ALERT"><span>ALERT</span></div>
  <div class="indicator unknown" style="top: 2%; left: 44%;" data-pin="PIN_PA15" data-dir="IN" title="STAT1_1"><span>STAT1_1</span></div>
  <div class="indicator unknown" style="top: 9.4%; left: 54.7%;" data-pin="PIN_PA12" data-dir="IN" title="STAT2_1"><span>STAT2_1</span></div>
  <div class="indicator unknown" style="top: 38%; left: 49%;" data-pin="PIN_PC8" data-dir="IN" title="COMP1"><span>COMP1</span></div>
  <div class="indicator unknown" style="top: 26%; left: 60%;" data-pin="PIN_PC12" data-dir="IN" title="PG2"><span>PG2</span></div>
  <div class="indicator unknown" style="top: 26%; left: 82%;" data-pin="PIN_PA8" data-dir="IN" title="PG1"><span>PG1</span></div>
  <div class="indicator unknown" style="top: 50%; left: 82%;" data-pin="PIN_PB1" data-dir="IN" title="PGOOD"><span>PGOOD</span></div>
  <div class="indicator unknown" style="top: 74%; left: 82%;" data-pin="PIN_PB2" data-dir="IN" title="PGOOD2"><span>PGOOD2</span></div>
  <div class="indicator unknown" style="top: 62%; left: 44%;" data-pin="PIN_PD2" data-dir="IN" title="STAT1_2"><span>STAT1_2</span></div>
  <div class="indicator unknown" style="top: 62%; left: 48%;" data-pin="PIN_PC9" data-dir="IN" title="STAT2_2"><span>STAT2_2</span></div>
  <div class="indicator unknown" style="top: 88%; left: 49%;" data-pin="PIN_PB15" data-dir="IN" title="COMP2"><span>COMP2</span></div>
  <div class="indicator unknown" style="top: 85%; left: 19%;" data-pin="PIN_PC3" data-dir="IN" title="KEY"><span>KEY</span></div>
</div>

<div id="editbar" hidden>
  <b>EDIT MODE</b> — drag elements with the mouse.
  <span id="editread">—</span>
  <button id="editcopy" type="button">Copy layout HTML</button>
  <button id="editsave" type="button">Save to index.html</button>
  <button id="editreset" type="button">Reset saved</button><br>
  <textarea id="editout" rows="6" cols="100" readonly
    placeholder="Drag, then Copy layout HTML and paste the lines back into index.html"></textarea>
</div>

<script src="static/script.js"></script>
</body>
</html>
